name: myks-setup-action
description: Setup myks
author: The Myks Authors
branding:
  color: green
  icon: download
inputs:
  token:
    description: Github token to use to avoid rate limits
    required: false
    default: ${{ github.token }}
  myks:
    description: myks version
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Install myks
      uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
      with:
        repo: mykso/myks
        tag: ${{ inputs.myks }}
        token: ${{ inputs.token }}
